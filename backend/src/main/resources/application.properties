# ===================================================================
# SERVER PORT CONFIGURATION
# ===================================================================
# Sets the port for the backend server
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/appdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# IMPORTANT: Change these to match your local MySQL credentials.
spring.datasource.username=root
spring.datasource.password=rootpassword

# The specific driver for MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA (Java Persistence API) CONFIGURATION
# ===================================================================
# This tells Hibernate (the JPA provider) which SQL dialect to use.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 'create-drop': Hibernate creates the schema on startup and drops it on shutdown.
# This is perfect for development as it gives you a fresh database every time.
spring.jpa.hibernate.ddl-auto=create-drop

# Show the actual SQL statements in the console (very useful for debugging)
spring.jpa.show-sql=true

# ===================================================================
# SQL INITIALIZATION
# ===================================================================
# This ensures our schema.sql script is always run on startup.
spring.sql.init.mode=always

api.service.url=http://mizugado-api:6102